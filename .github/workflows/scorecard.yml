name: Scorecard

# OpenSSF Scorecard: an outside measure of the repository's security habits
# (pinned actions, token permissions, branch protection, ...). Results go to
# Security > Code scanning and to the public Scorecard API (for the README
# badge). Weekly, and when the default branch changes.
on:
  push:
    branches: [main]
  schedule:
    - cron: "29 3 * * 1"

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the SARIF results
      id-token: write # publish the results to the Scorecard API (badge)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: results.sarif
          category: scorecard
