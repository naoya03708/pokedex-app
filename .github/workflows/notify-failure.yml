name: Notify failure

# Opens (or comments on) an issue when a workflow fails on main, a tag, a
# schedule or a published release, so a red run nobody is watching is not
# missed. Pull request runs are excluded: the author sees those. Dry runs
# (workflow_dispatch) too.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] only runs a trusted script from main; no code from the triggering run is checked out or executed
    workflows:
      - CI
      - CodeQL
      - govulncheck
      - Workflow lint
      - Release
      - Verify release
    types: [completed]

permissions:
  contents: read

jobs:
  issue:
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # open the issue and comment on it
    steps:
      # The default branch, not the commit that failed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVENT: ${{ github.event.workflow_run.event }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: scripts/notify-ci-failure.sh
