name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux checks. The macOS build of pull requests is macos-build.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: go tool staticcheck ./...

      - name: mygo vet
        run: go tool mygo vet .

      # The JSON goes through scripts/test_report.py, which prints the failures,
      # annotates the failing lines on the pull request and fills the job summary.
      # go test's own exit status decides whether the step fails.
      - name: go test
        run: |
          status=0
          go test -race -coverprofile=coverage.out -json ./... > test-results.json || status=$?
          python3 scripts/test_report.py test-results.json
          exit "$status"

      # Fails when a package's coverage falls below .github/coverage-baseline.txt.
      - name: Coverage ratchet
        run: python3 scripts/coverage_ratchet.py coverage.out .github/coverage-baseline.txt

      - name: Claude hook tests
        run: python3 -m unittest discover -s .claude/hooks

      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
